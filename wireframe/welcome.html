<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome - Customer Support Wireframe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="main">
        <section class="chat">
            <header class="chat-header">
                <div class="avatar" aria-hidden="true">CS</div>
                <div class="chat-title">
                    <strong>Customer Support</strong>
                    <span class="status">
                        <span class="status-dot" aria-hidden="true"></span>
                        Automated support &middot; Available 24/7
                    </span>
                </div>
            </header>

            <div class="messages">
                <div class="welcome-panel">
                    <div class="welcome-avatar" aria-hidden="true">CS</div>
                    <h1 class="welcome-title">Hi, how can we help?</h1>
                    <p class="welcome-text">Ask about filament compatibility or a printer issue.</p>

                    <p class="welcome-meta">Available 24/7 &middot; English (UK)</p>
                </div>
            </div>

            <footer class="composer-wrap">
                <div class="composer">
                    <button type="button" class="attach-btn" aria-label="Attach a file">+</button>
                    <div class="input-placeholder">Ask about your printer or filament...</div>
                    <button type="button" class="send-btn">Send</button>
                </div>
                <p class="disclaimer">Automated support assistant. For urgent issues, ask to speak with a human agent.</p>
            </footer>
        </section>
    </div>
</body>
</html>
