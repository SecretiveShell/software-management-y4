<svg xmlns="http://www.w3.org/2000/svg" viewBox="8 110 940 660" role="img" aria-labelledby="title desc">
  <title id="title">Project risk map</title>
  <desc id="desc">Risk IDs grouped by probability and impact from the risk register. Probability increases upwards; impact increases to the right. High probability and high impact: risks 23 and 28.</desc>
  <style>text { font-family: DejaVu Sans, Arial, sans-serif; fill: #243247; } .axis { font-size: 19px; font-weight: 700; } .label { font-size: 16px; fill: #65758b; } .id { font-size: 16px; font-weight: 700; fill: #ffffff; }</style>
